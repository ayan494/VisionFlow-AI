    </div>

     <button data-command="#features" class="w-full flex items-center gap-3 p-4 rounded-xl hover:bg-white/5 text-left"><i data-lucide="sparkles" class="w-5 h-5 text-violet-300"></i><span data-template-id="command-features" class="canva-text"></span></button> <button data-command="#dashboard" class="w-full flex items-center gap-3 p-4 rounded-xl hover:bg-white/5 text-left"><i data-lucide="layout-dashboard" class="w-5 h-5 text-cyan-300"></i><span data-template-id="command-dashboard" class="canva-text"></span></button> <button data-command="#pricing" class="w-full flex items-center gap-3 p-4 rounded-xl hover:bg-white/5 text-left"><i data-lucide="credit-card" class="w-5 h-5 text-lime-300"></i><span data-template-id="command-pricing" class="canva-text"></span></button> <button data-command="#faq" class="w-full flex items-center gap-3 p-4 rounded-xl hover:bg-white/5 text-left"><i data-lucide="circle-help" class="w-5 h-5 text-amber-300"></i><span data-template-id="command-faq" class="canva-text"></span></button>

  </div><button id="back-to-top" type="button" aria-label="Back to top" class="fixed bottom-5 left-5 z-40 w-11 h-11 grid place-items-center rounded-xl border border-white/10 bg-[#0b0d15]/80 text-cyan-300 opacity-0 pointer-events-none transition hover:bg-white/10"><i data-lucide="arrow-up" class="w-4 h-4"></i></button>
  <div id="toast" class="toast glass rounded-2xl p-4 flex items-center gap-3" role="status" aria-live="polite">
   <span class="w-8 h-8 grid place-items-center rounded-full bg-lime-300/10 text-lime-300"><i data-lucide="check" class="w-4 h-4"></i></span> <span id="toast-message" class="text-sm text-slate-200"></span>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      const loader = document.getElementById('loader');
      window.addEventListener('load', () => setTimeout(() => loader.classList.add('done'), 500));

      const progress = document.getElementById('scroll-progress');
      const updateProgress = () => {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        progress.style.width = `${max > 0 ? (window.scrollY / max) * 100 : 0}%`;
      };
      window.addEventListener('scroll', updateProgress, { passive: true });
      const backToTop = document.getElementById('back-to-top');
      window.addEventListener('scroll', () => { const visible = window.scrollY > 700; backToTop.classList.toggle('opacity-0', !visible); backToTop.classList.toggle('pointer-events-none', !visible); }, { passive: true });
      backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
      updateProgress();

      const cursorDot = document.getElementById('cursor-dot');
      const cursorRing = document.getElementById('cursor-ring');
      document.addEventListener('pointermove', (event) => {
        cursorDot.style.left = cursorRing.style.left = `${event.clientX}px`;
        cursorDot.style.top = cursorRing.style.top = `${event.clientY}px`;
      });
      document.querySelectorAll('a, button, input').forEach(el => {
        el.addEventListener('mouseenter', () => cursorRing.classList.add('hovering'));
        el.addEventListener('mouseleave', () => cursorRing.classList.remove('hovering'));
      });

      const mobileToggle = document.getElementById('mobile-toggle');
      const mobileMenu = document.getElementById('mobile-menu');
      mobileToggle.addEventListener('click', () => {
        const open = mobileMenu.classList.toggle('open');
        mobileToggle.setAttribute('aria-expanded', String(open));
      });
      mobileMenu.querySelectorAll('a').forEach(link => link.addEventListener('click', () => {
        mobileMenu.classList.remove('open');
        mobileToggle.setAttribute('aria-expanded', 'false');
      }));

      document.querySelectorAll('[data-scroll]').forEach(button => button.addEventListener('click', () => {
        document.querySelector(button.dataset.scroll)?.scrollIntoView({ behavior: 'smooth' });
      }));

      const revealObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in-view');
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: .12 });
      document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

      const statObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const el = entry.target;
          const target = Number(el.dataset.target);
          const decimals = Number(el.dataset.decimals || 0);
          const suffix = el.dataset.suffix || '';
          const started = performance.now();
          const tick = now => {
            const t = Math.min((now - started) / 1300, 1);
            const eased = 1 - Math.pow(1 - t, 3);
            el.textContent = `${(target * eased).toFixed(decimals)}${suffix}`;
            if (t < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
          statObserver.unobserve(el);
        });
      }, { threshold: .5 });
      document.querySelectorAll('.count-stat').forEach(el => statObserver.observe(el));

      document.querySelectorAll('.faq-trigger').forEach(trigger => {
        trigger.addEventListener('click', () => {
          const item = trigger.closest('.faq-item');
          const open = item.classList.toggle('open');
          trigger.setAttribute('aria-expanded', String(open));
        });
      });

      const monthlyToggle = document.getElementById('monthly-toggle');
      const yearlyToggle = document.getElementById('yearly-toggle');
      const setBilling = yearly => {
        document.querySelectorAll('.price-monthly').forEach(el => el.classList.toggle('hidden', yearly));
        document.querySelectorAll('.price-yearly').forEach(el => el.classList.toggle('hidden', !yearly));
        monthlyToggle.classList.toggle('bg-white/10', !yearly);
        monthlyToggle.classList.toggle('text-slate-400', yearly);
        yearlyToggle.classList.toggle('bg-white/10', yearly);
        yearlyToggle.classList.toggle('text-slate-400', !yearly);
        monthlyToggle.setAttribute('aria-pressed', String(!yearly));
        yearlyToggle.setAttribute('aria-pressed', String(yearly));
      };
      monthlyToggle.addEventListener('click', () => setBilling(false));
      yearlyToggle.addEventListener('click', () => setBilling(true));

      let toastTimer;
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      document.querySelectorAll('[data-toast]').forEach(button => button.addEventListener('click', () => {
        toastMessage.textContent = button.dataset.toast;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
      }));

      const searchModal = document.getElementById('search-modal');
      const commandModal = document.getElementById('command-modal');
      let previousFocus = null;
      const openModal = modal => {
        previousFocus = document.activeElement;
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
        setTimeout(() => modal.querySelector('input, button')?.focus(), 10);
      };
      const closeModal = modal => {
        modal.classList.remove('active');
        document.body.style.overflow = '';
        previousFocus?.focus();
      };
      document.getElementById('search-open').addEventListener('click', () => openModal(searchModal));
      document.getElementById('command-open').addEventListener('click', () => openModal(commandModal));
      document.querySelectorAll('.modal-close').forEach(button => button.addEventListener('click', () => closeModal(button.closest('.modal-backdrop'))));
      document.querySelectorAll('.modal-backdrop').forEach(modal => modal.addEventListener('mousedown', event => {
        if (event.target === modal) closeModal(modal);
      }));
      document.addEventListener('keydown', event => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
          event.preventDefault();
          openModal(commandModal);
        }
        if (event.key === 'Escape') {
          document.querySelectorAll('.modal-backdrop.active').forEach(closeModal);
        }
      });

      document.querySelectorAll('[data-command]').forEach(button => button.addEventListener('click', () => {
        closeModal(commandModal);
        document.querySelector(button.dataset.command)?.scrollIntoView({ behavior: 'smooth' });
      }));

      const searchableSections = [
        { title: 'AI Features', description: 'Automation, analytics, collaboration, security and APIs', target: '#features' },
        { title: 'Dashboard', description: 'Live analytics and intelligent workflow overview', target: '#dashboard' },
        { title: 'Customer Stories', description: 'Results from high-performing teams', target: '#customers' },
        { title: 'Pricing', description: 'Free, Pro and Enterprise plans', target: '#pricing' },
        { title: 'FAQ', description: 'Answers about setup, security and integrations', target: '#faq' }
      ];
      const input = document.getElementById('site-search');
      const results = document.getElementById('search-results');
      const empty = document.getElementById('search-empty');
      const renderResults = query => {
        const matches = searchableSections.filter(item => `${item.title} ${item.description}`.toLowerCase().includes(query.toLowerCase()));
        results.replaceChildren();
        empty.classList.toggle('hidden', matches.length > 0);
        matches.forEach(item => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'w-full text-left p-4 rounded-xl border border-white/5 hover:bg-white/5 transition';
          const title = document.createElement('strong');
          title.className = 'block text-sm text-white';
          title.textContent = item.title;
          const description = document.createElement('span');
          description.className = 'block text-xs text-slate-500 mt-1';
          description.textContent = item.description;
          button.append(title, description);
          button.addEventListener('click', () => {
            closeModal(searchModal);
            document.querySelector(item.target)?.scrollIntoView({ behavior: 'smooth' });
          });
          results.appendChild(button);
        });
      };
      input.addEventListener('input', () => renderResults(input.value));
      renderResults('');
      document.getElementById('contact-form').addEventListener('submit', event => { event.preventDefault(); document.getElementById('contact-success').classList.remove('hidden'); event.target.reset(); });
      document.getElementById('newsletter-form').addEventListener('submit', event => { event.preventDefault(); showToast('You’re on the VisionFlow newsletter.'); event.target.reset(); });
    });
  </script>
